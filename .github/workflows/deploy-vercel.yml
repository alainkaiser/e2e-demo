name: Deploy to Vercel

# Calls Sitewerk's private pipelines on GitHub Enterprise. The setup job
# stays skipped until VERCEL_PROJECT_ID is set, so this github.com checkout
# does not fail on every push.

on:
  pull_request:
    branches:
      - "main"
    types: [opened, synchronize, reopened]

  push:
    branches:
      - "main"

  workflow_dispatch:

jobs:
  setup:
    name: Setup Variables
    # The push that creates the repository runs before the factory has stored the
    # deploy credentials, so it is skipped. The template itself has no Vercel
    # project and never deploys.
    if: (github.event_name != 'push' || !github.event.created) && !github.event.repository.is_template && vars.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-latest
    outputs:
      vercel-project-id: ${{ steps.set-vars.outputs.vercel-project-id }}
      vercel-org-id: ${{ steps.set-vars.outputs.vercel-org-id }}
      prerelease-environment: ${{ steps.set-vars.outputs.prerelease-environment }}
      prerelease-alias: ${{ steps.set-vars.outputs.prerelease-alias }}
    steps:
      - name: Set variables as outputs
        id: set-vars
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          PRERELEASE_ENVIRONMENT: ${{ 'preview' }}
          PRERELEASE_ALIAS: ${{ '' }}
        run: |
          set -euo pipefail

          if [[ -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::error::Missing repository variable VERCEL_PROJECT_ID"
            exit 1
          fi

          # Without it the shared pipelines fall back to the main Sitewerk team.
          if [[ -z "$VERCEL_ORG_ID" ]]; then
            echo "::error::Missing repository variable VERCEL_ORG_ID"
            exit 1
          fi

          {
            printf 'vercel-project-id=%s\n' "$VERCEL_PROJECT_ID"
            printf 'vercel-org-id=%s\n' "$VERCEL_ORG_ID"
            printf 'prerelease-environment=%s\n' "$PRERELEASE_ENVIRONMENT"
            printf 'prerelease-alias=%s\n' "$PRERELEASE_ALIAS"
          } >> "$GITHUB_OUTPUT"

  deploy-preview:
    name: Deploy Preview/Integration
    needs: setup
    if: github.ref != 'refs/heads/main'
    # Both deploy jobs grant exactly what the shared pipelines' deploy jobs
    # request, because a called workflow cannot get more than its caller grants.
    permissions:
      contents: read
      deployments: write
      packages: read
    uses: devops-sw-projects/pipelines/.github/workflows/vercel-prerelease-deploy.yaml@main
    with:
      vercel-project-id: ${{ needs.setup.outputs.vercel-project-id }}
      vercel-org-id: ${{ needs.setup.outputs.vercel-org-id }}
      vercel-environment: ${{ needs.setup.outputs.prerelease-environment }}
      aliases: ${{ needs.setup.outputs.prerelease-alias }}
    secrets:
      vercel-token: ${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    name: Deploy to Production
    needs: setup
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
      packages: read
    uses: devops-sw-projects/pipelines/.github/workflows/vercel-production-deploy.yaml@main
    with:
      vercel-project-id: ${{ needs.setup.outputs.vercel-project-id }}
      vercel-org-id: ${{ needs.setup.outputs.vercel-org-id }}
    secrets:
      vercel-token: ${{ secrets.VERCEL_TOKEN }}
